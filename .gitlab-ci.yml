variables:
  VERSION_DOCKER: "$CI_COMMIT_REF_NAME-$CI_PIPELINE_IID"
  VERSION_LATEST: "$CI_COMMIT_REF_NAME-latest"
stages:
  - compilazione_dotnet_back
  - compila_angular_front
  - compila_dockerfile_back 
  - compila_dockerfile_front



compilazione_dotnet_back:
  stage: compilazione_dotnet_back
  image: mcr.microsoft.com/dotnet/sdk:7.0.202
  script:
    - "cd Back"
    - "dotnet restore"
    - "dotnet build -c Release"
  artifacts:
    paths:
      - Back/bin/

compila_dockerfile_back:
  stage: compila_dockerfile_back
  image: docker:dind
  script:
    - "cd Back" 
    - "docker login https://registry.servernas.it -u $DOCKER_USERNAME -p $DOCKER_PASSWORD" 
    - "docker build -t back ."
 
    - "docker tag back registry.servernas.it/pintour/back:$VERSION_DOCKER"
    - "docker push registry.servernas.it/pintour/back:$VERSION_DOCKER"
 
    - "docker tag back registry.servernas.it/pintour/back:$VERSION_LATEST"  
    - "docker push registry.servernas.it/pintour/back:$VERSION_LATEST"
   
compila_angular_front:
  stage: compila_angular_front
  image: node:16
  script:
    - "cd Front"
    - "npm install -g @angular/cli@9.1.14"
    - "npm install"
    - "ng build --prod"
  artifacts:
    paths:
      - Front/dist/

compila_dockerfile_front:
  stage: compila_dockerfile_front
  image: docker:dind
  script:
    - "cd Front"  
    - "docker login https://registry.servernas.it -u $DOCKER_USERNAME -p $DOCKER_PASSWORD"
    - "docker build -t front ."
    - "docker tag front registry.servernas.it/pintour/front:$VERSION_DOCKER"
    - "docker push registry.servernas.it/pintour/front:$VERSION_DOCKER"
    - "docker tag front registry.servernas.it/pintour/front:$VERSION_LATEST"
    - "docker push registry.servernas.it/pintour/front:$VERSION_LATEST"
    


  
version: "3.8" 
services: 
 back:
    image: docker.servernas.it/pintourbeckend
    environment:
    - TZ=Europe/Roma
    container_name: PintourBackEnd
    hostname: pintourback
    volumes:
    - pintour-public:/publish/public
    - pintour-log:/publish/app_data/log
#  ports:
#  - 35003:5000
    networks:
    - pintournet
 front:
    image: docker.servernas.it/pintourfrontend:test1
    container_name: PintourFontEnd
    volumes:
    - pintour-public:/usr/share/nginx/html/public
    environment:
    - TZ=Europe/Roma
    ports:
    - 45000:80
    networks:
    - pintournet
 db:
    image: docker.io/mcr.microsoft.com/mssql/server
    hostname: dbpintour
    container_name: PintourDB
    networks:
    - pintournet
    ports:
    - 45001:1433
    volumes:
    - pintour-backup:/mnt/backup
    - pintour-db:/var/opt/mssql/data/
  
    environment:
    - TZ=Europe/Roma
    - ACCEPT_EULA=Y
    - MSSQL_RPC_PORT=135
    - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - SA_PASSWORD=Svuhsbweuiybd37t3467g4j4hnrbd
networks:
  pintournet:
    driver: bridge
volumes:
  pintour-log:
  pintour-public:
  pintour-backup:
  pintour-db:

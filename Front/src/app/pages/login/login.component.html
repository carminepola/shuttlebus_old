<div class="container-fluid h-100 bg-login">


    <div class="row equal">
        <div class="col-12 col-xl-6 minHeigth bg-white d-flex align-items-center justify-content-center">



            <form method="post" class="py-2" (ngSubmit)='effettualogin()' ngNativeValidate>
                <div class="form-group d-none d-lg-block">
                    <img src="assets/img/logo/pink.png" class="maxw100">
                </div>
                <div class="form-group">
                    <input id="username" pattern="[^@]+@[^@]+\.[a-zA-Z]{2,}" class="form-control" type="email"
                        name="username" [value]="login.nomeUtente" placeholder="Username" maxlength="255" required
                        [ngClass]="{'is-invalid': nomeUtente.invalid && (nomeUtente.dirty || nomeUtente.touched),'is-valid':!nomeUtente.invalid}"
                        [(ngModel)]="login.nomeUtente" #nomeUtente="ngModel">
                </div>
                <div class="form-group">
                    <input id="password" class="form-control" type="Password" required name="password"
                        placeholder="Password" minlength="1" maxlength="255"
                        [ngClass]="{'is-invalid': password.invalid && (password.dirty || password.touched),'is-valid':!password.invalid}"
                        [(ngModel)]="pass" #password="ngModel">
                    <small><a data-toggle="modal" data-target="#exampleModal" class="text-secondary cursor-pointer">Ho
                            dimenticato la
                            password</a> </small>
                </div>
                <div class="form-group">

                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" (change)="login.ricorda = !login.ricorda;"
                            id="customCheck1" [checked]="login.ricorda">
                        <label class="custom-control-label pl-0" for="customCheck1">Ricordami</label>
                    </div>

                </div>
                <div class="form-group">
                    <button type="submit" [disabled]="share.isCaricamento('login', 'login1')"
                        class="btn btn-secondary float-right"> <span class="spinner-border spinner-border-sm mr-2"
                            *ngIf="share.isCaricamento('login', 'login1')" role="status" aria-hidden="true"></span>
                        Login</button>
                </div>
            </form>
        </div>
        <div class="col-xl-6 d-none d-xl-block ">
        </div>
    </div>


    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <form class="modal-content" ngNativeValidate (ngSubmit)='recuperoPassword()'>
                <div class="modal-body">

                    <div class="form-group">
                        <input class="form-control" required type="email" pattern="[^@]+@[^@]+\.[a-zA-Z]{2,}"
                            [value]="login.nomeUtente" name="q" placeholder="Email" [(ngModel)]="login.nomeUtente"
                            [ngClass]="{'is-invalid': nomeUtente.invalid && (nomeUtente.dirty || nomeUtente.touched),'is-valid':!nomeUtente.invalid}">
                    </div>

                    Ricorda di controllare la sezione spam della tua mail nel caso non dovessi vedere il messaggio
                    inviato.

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">Chiudi</button>
                    <button type="button" class="btn btn-secondary" type="submit"
                        [disabled]="share.isCaricamento('resettaPassword', 'login2')"> <span
                            class="spinner-border spinner-border-sm"
                            *ngIf="share.isCaricamento('resettaPassword', 'login2')" role="status"
                            aria-hidden="true"></span> Recupera la password</button>
                </div>
            </form>
        </div>
    </div>
</div>

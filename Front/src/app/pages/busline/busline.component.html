<app-loading-div *ngIf=" caricamento">

</app-loading-div>
<div *ngIf="!caricamento" class="bg-secondary text-white form-group d-flex flex-column   justify-content-center"
    style="min-height: 200px;">
    <div class="container-pintour">
        <div class="row">
            <div class="col-12">
                <h1>{{share.traduciPrivato(obj.traduzioniNome,obj.nome)}}</h1>
            </div>
        </div>

    </div>


</div>
<div class="container-pintour" *ngIf="!caricamento">

    <div class="row">
        <div class="form-group">

            <p class="text-muted font-weight-bold"
                [innerHTML]="share.traduciPrivato(obj.traduzioniDesc,obj.descrizione)">
            </p>
        </div>

    </div>
    <div class="row" *ngFor="let item of obj.itinerario; let i = index">

        <div class="col-12 col-xl ">
            <div class="form-group">
                <div class="img-thumbnail img" (click)="foto = item.foto;share.openModal('foto');">

                    <div class="h-100 w-100 bg-contain"
                        [style.background-image]="'url('+share.fotoUrl('../../../public/',item.foto)+')'">

                    </div>
                </div>
            </div>

        </div>
        <div class="col-12 col-xl ">
            <div class="form-group">
                <div [innerHTML]="share.traduci('busline_text_citta')" class="text-secondary font-weight-bold"></div>
                <div class="text-primary font-weight-bold"
                    [innerHTML]="share.traduciPrivato(item.traduzioniCitta,item.citta)">
                </div>
            </div>

        </div>
        <div class="col-12 col-xl">
            <div class="form-group">
                <div [innerHTML]="share.traduci('busline_text_indirizzo')" class="text-secondary font-weight-bold">
                </div>
                <a target="_blank" href="https://www.google.com/maps/search/?api=1&query={{item.lat}},{{item.lng}}"
                    class="text-primary cursor-pointer font-weight-bold" [innerHTML]="item.indirizzo"></a>
            </div>

        </div>
        <div class="col-12 col-xl">



            <div class="form-group">

                <select id="my-select" [(ngModel)]="lineaSelezionata" class="form-control" name="">
                    <option value="">{{share.traduci('text_busline_filtro')}}</option>
                    <option [value]="j" *ngFor="let orario of obj.fasceOrarie; let j = index">
                        {{share.traduci('text_busline_fascia')}} {{j+1}}</option>
                </select>
            </div>
            <div class="form-group">
                <div *ngFor="let orario of obj.fasceOrarie; let j = index">

                    <div *ngIf="lineaSelezionata == '' || lineaSelezionata == j" class="text-primary">
                        <span class=" font-weight-bold">{{share.traduci('text_busline_fascia')}}
                            {{j + 1}}:&nbsp;</span>{{orario.orari[i].orario.substring(0,5)}}
                    </div>
                </div>

            </div>





        </div>






        <div class="col-12 col-xl ">
            <div class="form-group">
                <div [innerHTML]="share.traduci('busline_text_note')" class="text-secondary font-weight-bold"></div>

                <div class="text-primary font-weight-bold"
                    [innerHTML]="share.traduciPrivato(item.traduzioniNote,item.note)">
                </div>
            </div>



        </div>
        <div class=" col-12" *ngIf="i+1 != obj['itinerario'].length">
            <hr class="w-100 py-3 border-secondary">
        </div>

    </div>

    <div class="row equal-lg py-xl-4  py-2 my-2">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-8    ">
            <div class="h-100 d-flex flex-column   justify-content-center">
                <div class=" py-3">
                    <div>
                        <h2 class="text-secondary" [innerHTML]="share.traduci('text_busline_5')"></h2>
                    </div>
                    <h4 class="font-weight-bold text-muted" [innerHTML]="share.traduci('text_busline_6')">

                    </h4>
                </div>


            </div>


        </div>
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-4 py-2 ">
            <div class="h-100 d-flex flex-column   justify-content-center">
                <div class=" py-3">

                    <div>
                        <button [routerLink]="['']" routerLinkActive="router-link-active"
                            class="btn btn-block btn-secondary">{{share.traduci('text_busline_7')}}</button>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <div class="modal fade" tabindex="-1" role="dialog" id="foto">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="h-100 w-100 bg-contain" style="max-height: 70%;">

                    <img [src]="share.fotoUrl('../../../public/',foto)" class="w-100 rounded" />
                </div>
            </div>
        </div>
    </div>

<app-loading-div *ngIf="share.commonF.isEmpty(ris)">

</app-loading-div>
<div class="container-pintour" *ngIf="!share.commonF.isEmpty(ris)">
    <div class="row">
        <div class="col-12 col-6 offset-xl-3">
            <div class="form-group">
                <h2 class="text-secondary">{{share.traduci('str_titolo_pagamento')}}</h2>
            </div>

        </div>
    </div>
    <div class="row" *ngIf="ris.data.length == 0">
        <div class="col-12 col-xl-6 offset-xl-3 cursor-pointer text-center">
            <div class="form-group">
                <h2 class="text-muted">{{share.traduci('str_nessunMetodoDiPagamento')}}</h2>
            </div>
        </div>
    </div>
    <div class="row" *ngIf="seEsisteMetodo('private')" (click)="clickMetodo('private')">

        <div class="col-12 col-xl-6 offset-xl-3 cursor-pointer">
            <div class="form-group">
                <div class="card">
                    <div class="card-body text-center">
                        <h2 class="text-secondary">{{share.traduci('str_paga_come_rivenditore')}}</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row" *ngIf="seEsisteMetodo('paypal')" (click)="clickMetodo('paypal')">

        <div class="col-12 col-xl-6 offset-xl-3 cursor-pointer">
            <div class="form-group">
                <div class="card">
                    <div class="card-body text-center">
                        <img class="w-50 mb-3" src="/assets/img/logo/Paypal-Logo-300x91.png">
                        <p class="text-muted">{{share.traduci('str_qualcosa_paypal')}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row" *ngIf="seEsisteMetodo('stripe')" (click)="clickMetodo('stripe')">

        <div class="col-12 col-xl-6 offset-xl-3 cursor-pointer">
            <div class="form-group">
                <div class="card">
                    <div class="card-body text-center">
                        <img class="w-50 mb-3"
                            src="https://www.internationalscienceediting.com/wp-content/uploads/2017/06/logo-stripe.png">
                        <p class="text-muted">{{share.traduci('str_qualcosa_stripe')}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-loading-div *ngIf="caricamento">

</app-loading-div>

<div class="container-fluid animated fadeIn faster" *ngIf="!caricamento">
    <div class="row">
 
        <div class="col-12 col-xl-6">
            <div class="form-group">
                <input class="form-control" type="text" name="search" [(ngModel)]="searchText" autocomplete="off"
                    [placeholder]="share.traduci('search')">
            </div>
        </div>
        <div class="col-12 col-xl-4">

            <input class="form-control" type="month"  [(ngModel)]="dataSearch" autocomplete="off">
        </div>
        <div class="col-12 col-xl-2"> 
<button class="btn btn-primary mt-2 mt-xl-0 btn-block" (click)="caricaDati(dataSearch)">Aggiorna</button>
        </div>

        <div class="col-12"  >

            <div class="table-responsive">
            <table class="table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Biglietto</th>
                    <th scope="col">Nome e Cognome</th>
                    <th scope="col">Email</th>
                    <th scope="col">Telefono</th>
                    <th scope="col">Data Aquisto</th>
                    <th scope="col">Data Viaggio</th>
                    <th scope="col">Da</th>
                    <th scope="col">A</th>
                    <th scope="col">Partenza</th>
                   
                    <th scope="col">Arrivo</th>
                    <th scope="col">Posti</th>
                    <th scope="col">Bagagli</th>
                    <th scope="col">Prezzo</th>
                    <th scope="col">Dettagli</th>
                    <th scope="col">Azioni</th>
             
             
                   
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of data | filter:searchText; let i =  index">
                    <th [innerText]="item.id"></th>
                    <th scope="row" [innerText]="item.riferimento"></th>
                    <td  [innerText]="item.nome"> </td>
                    <td  >  <a [href]="'mailto:'+item.email" [innerText]="item.email"> </a></td>
                    <td  >  <a [href]="'tel:'+item.telefono" [innerText]="item.telefono">
                       
                     </a> </td>
                    <td [innerText]="item.data"></td>
                    <td [innerText]="item.dataViaggio"></td>
                    <td [innerText]="item.from"></td>
                    <td [innerText]="item.to"></td>
                    <td [innerText]="item.partenza"></td>
                 
                    <td [innerText]="item.arrivo"></td>
                    <td [innerText]="item.posti"></td>
                    <td [innerText]="item.bagagli"></td>
                    <td [innerText]="item.prezzo + '€'"></td>
                    <td  [innerHTML]="item.dettagli"> 
                       
                    </td>
                    <td  >
                        <div *ngIf="item.rimborsato">
                            <h5 class="text-danger font-weight-bold">Annullato</h5>


                        </div>
                        <div *ngIf="!item.rimborsato">
                            <button class="btn btn-danger btn-sm " (click)="annulla(item)"><i class="fa fa-delete  "></i>Annulla</button>
                            

                        </div>
                       

                    </td>  
                  </tr>
                 
                </tbody>
              </table>
            </div>
           

        </div>
    </div>
</div>

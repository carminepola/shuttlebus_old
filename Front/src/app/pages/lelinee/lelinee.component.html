<div class="bg-secondary text-white form-group d-flex flex-column   justify-content-center" style="min-height: 200px;">
    <div class="container-pintour">
        <div class="row">
            <div class="col-12">
                <h1 [innerHTML]="share.traduci('text_buslines_1')"></h1>
            </div>
        </div>

    </div>


</div>
<app-loading-div *ngIf="caricamento">

</app-loading-div>

<div class="container-pintour animated fadeIn faster" *ngIf="!caricamento">
    <div class="row py-3">
        <div class="col-8 d-none d-lg-block">
            <h2 class="text-secondary" [innerHTML]="share.traduci('text_buslines_2')"></h2>


        </div>
        <div class="col-12 col-lg-4">
            <div class="form-group">
                <label class="d-block d-lg-none" [innerHTML]="share.traduci('text_buslines_2')"></label>
                <input minlength="3" class="form-control" type="text" name="search" [(ngModel)]="searchText"
                    autocomplete="off" [placeholder]="share.traduci('text_buslines_3')">
            </div>
        </div>
    </div>
    <div class="row py-3"
        *ngFor="let item of data.sort(share.sortBy(share.getLenguage(),'asc')).slice(0,limitTo) |filter:searchText; let i = index">
        <div class="col-12 col-lg-8 pb-2">
            <div class="form-group">

                <h2 class="text-secondary">{{share.traduciPrivato(item.traduzioniNome,item.nome)}}</h2>

            </div>
        </div>
        <div class="col-12 col-lg-4 order-11 order-lg-1">
            <div class="form-group">
                <a class="btn btn-secondary btn-block"
                    [routerLink]="['/'+share.getLenguage()+'/busline',item.id,share.generaNome(share.traduciPrivato(item.traduzioniNome,item.nome))]"
                    routerLinkActive="router-link-active" [innerHTML]="share.traduci('text_buslines_4')"></a>
            </div>
        </div>
        <div class="col-12 order-1 order-lg-11">

            <div class="row font-weight-bold text-primary d-none d-xl-flex">
                <div *ngFor="let punto of item['itinerario']; let i = index; " class="col-4 col-md-4 col-lg-1 col-xl-2">

                    <div class="row">
                        <div class="col-6  d-flex flex-column   justify-content-center text-center">
                            <div class="form-group">

                                <div
                                    [innerHTML]="sottolineaCercato(share.traduciPrivato(punto.traduzioniCitta,punto.citta),searchText)">
                                </div>
                                <small [innerHTML]="sottolineaCercato(punto.indirizzo,searchText)"></small>
                            </div>
                        </div>
                        <div class="col-6" *ngIf="i +1 != item['itinerario'].length">
                            <div class="form-group pt-3">
                                <hr class="w-50 border-secondary" style="border: solid 2px;">
                            </div>

                        </div>

                    </div>


                </div>



            </div>
            <div class="row font-weight-bold  text-secondary d-flex d-xl-none">
                <div class="col-12">
                    <div class="form-group">
                        <ul>
                            <li *ngFor="let punto of item['itinerario']; let i = index; ">
                                <span
                                    class="text-primary">{{share.traduciPrivato(punto.traduzioniCitta,punto.citta)}}</span>
                                &nbsp; <small class="text-primary">({{punto.indirizzo}})</small></li>

                        </ul>
                    </div>
                </div>
            </div>

        </div>
        <div class="col-12 order-12">

            <hr class="w-75 pb-4 border-secondary" *ngIf="i+1 != data.length">
        </div>




    </div>

</div>

<app-loading-div *ngIf="share.commonF.isEmpty(ris)">

</app-loading-div>
<div class="container animated fadeIn faster" *ngIf="!share.commonF.isEmpty(ris)">
    <div class="row">
        <div class="col-12">
            <div class="form-group float-right">
                <button class="btn btn-primary" [routerLink]="['/biglietto']"
                    routerLinkActive="router-link-active">Nuovo biglietto</button>
            </div>
        </div>
        <div class="col-12">
            <div class="form-group">
                <input class="form-control" type="text" name="search" [(ngModel)]="searchText" autocomplete="off"
                    [placeholder]="share.traduci('search')">
            </div>
        </div>

        <div class="col-12" *ngFor="let item of data | filter:searchText; let i =  index ">

            <div class="form-group" *ngIf="item.cancellato != true  ">
                <div class="card">

                    <div class="card-body">
                        <div class="row">
                            <div class="col-12 col-lg-8">
                                <div class="form-group">

                                    <h5 class="card-title">
                                        {{share.traduciPrivato(item.traduzioniNome,item.nome)}}</h5>
                                    <p class="card-text"
                                        [innerHTML]="share.traduciPrivato(item.traduzioniDesc,item.descrizioni)">
                                    </p>
                                    <p class="card-text">Costo: {{item.costo}}€</p>
                                </div>
                            </div>
                            <div class="col-12 col-lg-4 ">
                                <div class="form-group float-right">
                                    <div class="btn-group-justified" role="group" aria-label="Vertical button group">
                                        <button class="btn btn-primary mr-2 mt-2" [routerLink]="['/biglietto',item.id]"
                                            routerLinkActive="router-link-active">
                                            Modifica
                                        </button>
                                        <button class="btn btn-danger mt-2" (click)="elimina(item.id)">
                                            Elimina
                                        </button>
                                    </div>
                                </div>


                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navbar">
    <a class="navbar-brand" routerLink="" class="navbar-imgContainer pr-2">
        <img class="navbar-imgLogo" src="assets/img/logo/pink.png" height="16px">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item " [ngClass]="{'active': share.samePath('dash')}">
                <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-link" href="#" [routerLink]="['/dash']" routerLinkActive="router-link-active">Dashboard
                </a>
            </li>
            <li class="nav-item " [ngClass]="{'active': share.samePath('tickets')}">
                <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-link" href="#" [routerLink]="['/tickets']" routerLinkActive="router-link-active">Acquisti
                </a>
            </li>
            <li class="nav-item " [ngClass]="{'active': share.samePath('linee')}">
                <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-link cursor-pointer" [ngClass]="{'active': share.samePath('linee')}"
                    [routerLink]="['/linee']" routerLinkActive="router-link-active">Linee </a>
            </li>
            <li class="nav-item" [ngClass]="{'active': share.samePath('fermate')}">
                <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-link cursor-pointer" [routerLink]="['/fermate']"
                    routerLinkActive="router-link-active">Fermate</a>
            </li>
            <li  data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-item" [ngClass]="{'active': share.samePath('biglietti')}">
                <a class="nav-link cursor-pointer" [routerLink]="['/biglietti']"
                    routerLinkActive="router-link-active">Biglietti</a>
            </li>
            <li  class="nav-item dropdown"
                [ngClass]="{'active': share.samePath('user') || share.samePath('utenti') || share.samePath('traduzioni')|| share.samePath('listafaq')}">
                <a   data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown"
                    aria-haspopup="true" aria-expanded="false">
                    Gestione
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="dropdown-item" [ngClass]="{'active': share.samePath('user')}" href="#"
                        [routerLink]="['/user']" routerLinkActive="router-link-active">Profilo</a>
                    <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="dropdown-item" href="#" [routerLink]="['/utenti']"
                        [ngClass]="{'active': share.samePath('utenti')}" routerLinkActive="router-link-active"
                        *ngIf="share.getRuolo()<10">Utenti</a>
                    <div class="dropdown-divider"></div>
                    <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="dropdown-item" href="#" [routerLink]="['/traduzioni']"

                        *ngIf="share.getRuolo()<10">Traduzioni</a>
                    <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="dropdown-item" href="#" [routerLink]="['/listafaq']"
                        [ngClass]="{'active': share.samePath('listafaq')}" routerLinkActive="router-link-active"
                        *ngIf="share.getRuolo()<10">FAQ</a>

                    <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="dropdown-item" href="#" [routerLink]="['/settings']"
                        routerLinkActive="router-link-active">Impostazioni</a>
                </div>
            </li>

                <a  data-toggle="collapse" data-target=".navbar-collapse.show" class="nav-link cursor-pointer" tabindex="-1" aria-disabled="true" (click)="logout()">Logout</a>

        </ul>

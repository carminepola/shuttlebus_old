<div>
    <div class="container-pintour pr-0  bg-secondary">

        <div class="row equal-lg ">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-5  bg-secondary text-white   ">
                <div class="h-100 d-flex flex-column   justify-content-center">
                    <div class=" py-3">
                        <div>
                            <h2 [innerHTML]="share.traduci('text_home_2')"></h2>
                        </div>
                        <div [innerHTML]="share.traduci('text_home_3')">

                        </div>
                    </div>


                </div>


            </div>
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-7 py-2 bg-napoli">

            </div>
        </div>



    </div>
</div>
<div>
    <div class="container-pintour  ">
        <div class="row equal-lg ">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-6    ">
                <div class="h-100 d-flex flex-column   justify-content-center">
                    <div class=" py-3">
                        <div>
                            <h2 class="text-secondary" [innerHTML]="share.traduci('text_home_4')"></h2>
                        </div>
                        <h4 class=" text-muted" [innerHTML]="share.traduci('text_home_5')">

                        </h4>
                    </div>


                </div>


            </div>
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-6 py-2 minHeight">
                <div class="h-100 d-flex flex-column   justify-content-center">
                    <div class=" py-3">
                        <div>
                            <div class="form-group">
                                <input class="form-control" [(ngModel)]="indirizzoRichiesto"
                                    placeholder="{{share.traduci('text_home_6')}}">
                            </div>

                        </div>
                        <div>
                            <button [disabled]="caricamentoButton" class="btn btn-block btn-secondary"
                                (click)="calcolaFermata()">{{share.traduci('text_home_7')}}</button>
                        </div>
                    </div>


                </div>
            </div>

        </div>
        <div class="row equal-lg jumbotron">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-4 offset-xl-4   ">
                <div class="h-100 d-flex flex-column text-center  justify-content-center">
                    <div class=" py-2 ">
                        <div>

                            <div class="form-group">
                                <h2 class="text-secondary" [innerHTML]="share.traduci('text_home_search')"></h2>
                            </div>
                        </div>
                        <div class="form-group">
                            <input class="form-control" [(ngModel)]="cercaBiglietto"
                                placeholder="{{share.traduci('text_home_cercaBigliettoEmail')}}">
                        </div>
                        <div class="form-group">
                            <button class="btn btn-block btn-secondary"
                                (click)="vaiacerca(cercaBiglietto)">{{share.traduci('text_bottone_cerca')}}</button>
                        </div>

                    </div>


                </div>


            </div>


        </div>

    </div>
</div>
<div class="modal" tabindex="-1" role="dialog" id="fermata">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-secondary">{{share.traduci('str_titolo_fermata')}}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div class="row">

                        <div class="col-12 col-xl-3">
                            <div class="img-thumbnail img">

                                <div class="h-100 w-100 bg-contain"
                                    [style.background-image]="'url('+share.fotoUrl('public/',fermata.foto)+')'">

                                </div>


                            </div>
                        </div>
                        <div class="col-12 col-xl-9">
                            <h2 class="text-secondary">{{share.traduciPrivato(fermata.traduzioniCitta,fermata.citta)}}
                            </h2>
                            <span class="text-muterd">{{fermata.indirizzo}}<br>{{share.traduci('str_a_serch')}}
                                <span class="text-primary font-weight-bold">{{fermata.km}} km</span>&nbsp;
                                {{share.traduci('str_da_serch')}} </span>
                            <input class="form-control" disabled [(ngModel)]="indirizzoCercato">
                        </div>
                    </div>
                </div>

                <div id="map" class="border-radius" style="height: 300px;
    width: 100%;
  
    overflow: hidden;"></div>


            </div>
        </div>
    </div>
